<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose new password · AmberOne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <nav class="nav"><a class="nav-brand" href="/">Amber<span>One</span></a></nav>
  <main class="wrap-narrow">
    <div class="panel">
      <h1>Choose a new password</h1>
      <div id="banner" class="banner"></div>
      <form id="reset-form">
        <label class="label" for="password">New password (8+ characters)</label>
        <input class="field" id="password" type="password" required minlength="8" autocomplete="new-password" />
        <button class="btn btn-primary btn-block" type="submit">Update password</button>
      </form>
    </div>
  </main>
  <script src="/assets/app.js"></script>
  <script>
    const token = AmberOne.qs("token");
    const banner = document.getElementById("banner");
    if (!token) AmberOne.showBanner(banner, "Missing reset token. Request a new link.", "err");
    document.getElementById("reset-form").onsubmit = async (e) => {
      e.preventDefault();
      const { res, data } = await AmberOne.api("/api/auth/reset-password", {
        method: "POST",
        body: JSON.stringify({ token, password: document.getElementById("password").value }),
      });
      if (!res.ok) {
        AmberOne.showBanner(banner, data.error || "Reset failed", "err");
        return;
      }
      AmberOne.showBanner(banner, data.message || "Password updated.", "ok");
      setTimeout(() => (location.href = "/login.html"), 900);
    };
  </script>
</body>
</html>
