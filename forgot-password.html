<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password · AmberOne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <nav class="nav"><a class="nav-brand" href="/">Amber<span>One</span></a></nav>
  <main class="wrap-narrow">
    <div class="panel">
      <h1>Reset password</h1>
      <p class="lede">We’ll prepare a secure reset link for your account.</p>
      <div id="banner" class="banner"></div>
      <form id="forgot-form">
        <label class="label" for="email">Email</label>
        <input class="field" id="email" type="email" required autocomplete="email" />
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
      <p class="lede" style="margin-top:1rem;text-align:center"><a href="/login">Back to sign in</a></p>
    </div>
  </main>
  <script src="/assets/app.js"></script>
  <script>
    document.getElementById("forgot-form").onsubmit = async (e) => {
      e.preventDefault();
      const banner = document.getElementById("banner");
      const { res, data } = await AmberOne.api("/api/auth/forgot-password", {
        method: "POST",
        body: JSON.stringify({ email: document.getElementById("email").value }),
      });
      if (!res.ok) {
        AmberOne.showBanner(banner, data.error || "Request failed", "err");
        return;
      }
      AmberOne.showBanner(
        banner,
        data.message || "If that email exists, a reset link was sent. Check your inbox and spam folder.",
        "ok",
      );
      // Dev-only fallback URL (never shown when API withholds it in production)
      if (data.resetUrl) {
        const a = document.createElement("a");
        a.href = data.resetUrl;
        a.textContent = "Open reset link";
        a.style.display = "block";
        a.style.marginTop = "0.75rem";
        banner.appendChild(a);
      }
    };
  </script>
</body>
</html>
