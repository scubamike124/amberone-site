<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Follow-ups · AmberOne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <nav class="nav" aria-label="Primary">
    <a class="nav-brand" href="/dashboard/">Amber<span>One</span></a>
    <button type="button" class="nav-toggle" data-nav-toggle aria-label="Menu">Menu</button>
    <div class="nav-links" data-nav-links>
      <a href="/dashboard/executive/">Executive</a>
      <a href="/dashboard/executive/crm.html">CRM</a>
      <a href="/dashboard/executive/follow-ups.html">Follow-ups</a>
      <a href="#" data-logout>Log out</a>
    </div>
  </nav>
  <main class="wrap">
    <div class="dash-shell">
      <aside data-dash-nav data-active="Executive"></aside>
      <div class="dash-main">
        <header class="dash-header"><h1>Follow-ups</h1><p class="lede">AI-suggested next actions from meetings and CRM.</p></header>
        <article class="ao-card is-hero">
          <div class="ao-card-head">
            <div class="ao-card-title"><span class="ao-icon is-warn">→</span><div><h2>Suggested actions</h2><p class="ao-card-meta">Generated from your week</p></div></div>
            <button type="button" class="btn btn-primary btn-sm" id="regen">Generate</button>
          </div>
          <div id="followups"><div class="skeleton lg"></div></div>
        </article>
      </div>
    </div>
  </main>
  <script src="/assets/app.js"></script>
  <script src="/assets/dash-chrome.js"></script>
  <script>
    (async () => {
      await AmberOne.requireAuth();
      async function generate() {
        const el = document.getElementById("followups");
        el.innerHTML = `<p class="lede">Analyzing recent meetings…</p>`;
        const { res, data } = await AmberOne.api("/api/talk", {
          method: "POST",
          body: JSON.stringify({ message: "Based on my recent calendar events and CRM interactions, suggest my top 3 follow-up actions for today. Be specific and actionable." }),
        });
        el.innerHTML = `<div class="briefing-body">${(data.reply || data.content || "No suggestions available.").replace(/</g, "&lt;")}</div>`;
      }
      document.getElementById("regen").onclick = generate;
      generate();
    })();
  </script>
</body>
</html>
