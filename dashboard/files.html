<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Files · AmberOne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <nav class="nav" aria-label="Primary">
    <a class="nav-brand" href="/dashboard/">Amber<span>One</span></a>
    <button type="button" class="nav-toggle" data-nav-toggle aria-label="Menu">Menu</button>
    <div class="nav-links" data-nav-links>
      <a href="/dashboard/">Home</a>
      <a href="/dashboard/files">Files</a>
      <a href="/dashboard/projects">Projects</a>
      <a class="nav-notif" href="/dashboard/notifications">Notifications<span class="badge" data-notif-badge hidden>0</span></a>
      <a href="#" data-logout>Log out</a>
    </div>
  </nav>
  <main class="wrap">
    <div class="dash-shell">
      <aside data-dash-nav></aside>
      <section>
        <h1>Files</h1>
        <p class="lede">Upload notes, PDFs, and images. Files stay private unless you attach them to a project your teammates can open.</p>
        <div id="banner" class="banner"></div>
        <div class="panel" style="margin-bottom:1.25rem">
          <h2>Upload</h2>
          <form id="upload-form">
            <input class="field" id="file-input" type="file" required />
            <button class="btn btn-primary" type="submit">Upload</button>
          </form>
        </div>
        <div class="panel">
          <h2>Your files</h2>
          <div id="file-list"><p class="empty-state">Loading…</p></div>
        </div>
      </section>
    </div>
  </main>
  <script src="/assets/app.js"></script>
  <script src="/assets/dash-chrome.js"></script>
  <script>
    (async () => {
      const user = await AmberOne.requireAuth();
      if (!user) return;
      const banner = document.getElementById("banner");

      async function load() {
        const { res, data } = await AmberOne.api("/api/files");
        if (!res.ok) {
          const msg =
            data.code === "r2_unbound"
              ? "File storage is still connecting. Wait a moment and refresh."
              : data.error || "Could not load files.";
          AmberOne.showBanner(banner, msg, "err");
          document.getElementById("file-list").innerHTML = `<p class="empty-state">${msg}</p>`;
          return;
        }
        const files = data.files || [];
        document.getElementById("file-list").innerHTML = files.length
          ? `<ul class="list">${files.map((f) =>
              `<li class="list-item"><div class="meta-col"><strong>${String(f.name).replace(/</g,"&lt;")}</strong><span class="sub">${f.content_type || ""} · ${f.size} bytes</span></div>
                <div class="row-actions">
                  <a class="btn btn-ghost btn-sm" href="${f.url}">Download</a>
                  <button class="btn btn-ghost btn-sm" data-del="${f.id}">Remove</button>
                </div></li>`).join("")}</ul>`
          : `<p class="empty-state">No files yet.</p>`;
        document.querySelectorAll("[data-del]").forEach((btn) => {
          btn.onclick = async () => {
            const { res, data } = await AmberOne.api(`/api/files?id=${encodeURIComponent(btn.dataset.del)}`, { method: "DELETE" });
            if (!res.ok) AmberOne.showBanner(banner, data.error || "Could not delete", "err");
            load();
          };
        });
      }

      document.getElementById("upload-form").onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById("file-input");
        const file = input.files?.[0];
        if (!file) return;
        const fd = new FormData();
        fd.append("file", file);
        const res = await fetch("/api/files", { method: "POST", credentials: "include", body: fd });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          AmberOne.showBanner(
            banner,
            data.code === "r2_unbound"
              ? "File storage is still connecting. Wait a moment and try again."
              : data.error || "Upload failed",
            "err",
          );
          return;
        }
        input.value = "";
        AmberOne.showBanner(banner, "Uploaded.", "ok");
        load();
      };

      load();
    })();
  </script>
</body>
</html>
