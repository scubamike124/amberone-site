<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memories · AmberOne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <nav class="nav" aria-label="Primary">
    <a class="nav-brand" href="/dashboard/">Amber<span>One</span></a>
    <button type="button" class="nav-toggle" data-nav-toggle aria-label="Menu">Menu</button>
    <div class="nav-links" data-nav-links>
      <a href="/dashboard/">Home</a>
      <a href="/dashboard/calendar">Calendar</a>
      <a href="/dashboard/reminders">Reminders</a>
      <a href="/dashboard/memories">Memories</a>
      <a href="/dashboard/notes">Notes</a>
      <a href="/dashboard/connections">Connections</a>
      <a href="/dashboard/billing">Billing</a>
      <a href="/dashboard/settings">Settings</a>
      <a class="nav-notif" href="/dashboard/notifications">Notifications<span class="badge" data-notif-badge hidden>0</span></a>
      <a href="#" data-logout>Log out</a>
    </div>
  </nav>
  <main class="wrap">
    <div class="dash-shell">
      <aside data-dash-nav></aside>
      <section>
        <h1>Memories</h1>
        <p class="lede">What Amber remembers about you — people, dates, preferences, and notes. Amber can also save these automatically while you talk.</p>
        <div id="banner" class="banner"></div>

        <div class="panel" style="margin-bottom:1.25rem">
          <h2>Add a memory</h2>
          <form id="memory-form">
            <label class="label" for="mem-title">Title</label>
            <input class="field" id="mem-title" required placeholder="Anniversary, allergy, favorite restaurant…" />
            <label class="label" for="mem-content">Details</label>
            <input class="field" id="mem-content" required placeholder="What should Amber remember?" />
            <div style="display:grid;gap:0.75rem;grid-template-columns:1fr 1fr">
              <div>
                <label class="label" for="mem-kind">Kind</label>
                <select class="field" id="mem-kind">
                  <option value="note">Note</option>
                  <option value="person">Person</option>
                  <option value="date">Date</option>
                  <option value="place">Place</option>
                  <option value="preference">Preference</option>
                </select>
              </div>
              <div>
                <label class="label" for="mem-importance">Importance</label>
                <select class="field" id="mem-importance">
                  <option value="1">1 — minor</option>
                  <option value="2">2</option>
                  <option value="3" selected>3 — normal</option>
                  <option value="4">4</option>
                  <option value="5">5 — critical</option>
                </select>
              </div>
            </div>
            <button class="btn btn-primary" type="submit">Save memory</button>
          </form>
        </div>

        <div class="panel">
          <h2>Saved memories</h2>
          <div id="memories-list"><p class="empty-state">Loading…</p></div>
        </div>
      </section>
    </div>
  </main>
  <script src="/assets/app.js"></script>
  <script src="/assets/dash-chrome.js"></script>
  <script>
    (async () => {
      const user = await AmberOne.requireAuth();
      if (!user) return;
      const banner = document.getElementById("banner");

      async function loadMemories() {
        const { res, data } = await AmberOne.api("/api/memories");
        if (!res.ok) {
          document.getElementById("memories-list").innerHTML = `<p class="empty-state">${data.error || "Could not load memories."}</p>`;
          return;
        }
        const memories = data.memories || [];
        document.getElementById("memories-list").innerHTML = memories.length
          ? `<ul class="list">${memories
              .map(
                (m) => `<li class="list-item">
                  <div class="meta-col">
                    <strong>${m.title}</strong>
                    <span class="sub">${m.content}</span>
                    <span class="sub">${m.kind} · importance ${m.importance} · ${m.source}</span>
                  </div>
                  <div class="row-actions">
                    <button class="btn btn-ghost btn-sm" data-delete="${m.id}">Delete</button>
                  </div>
                </li>`,
              )
              .join("")}</ul>`
          : `<p class="empty-state">No memories yet. Add one above, or just tell Amber in Talk.</p>`;

        document.querySelectorAll("[data-delete]").forEach((btn) => {
          btn.onclick = async () => {
            btn.disabled = true;
            const { res, data } = await AmberOne.api(`/api/memories?id=${encodeURIComponent(btn.dataset.delete)}`, { method: "DELETE" });
            if (!res.ok) {
              AmberOne.showBanner(banner, data.error || "Could not delete memory", "err");
              btn.disabled = false;
              return;
            }
            loadMemories();
          };
        });
      }

      document.getElementById("memory-form").onsubmit = async (e) => {
        e.preventDefault();
        const title = document.getElementById("mem-title").value.trim();
        const content = document.getElementById("mem-content").value.trim();
        const kind = document.getElementById("mem-kind").value;
        const importance = Number(document.getElementById("mem-importance").value);
        if (!title || !content) return;
        const { res, data } = await AmberOne.api("/api/memories", {
          method: "POST",
          body: JSON.stringify({ title, content, kind, importance }),
        });
        if (!res.ok) {
          AmberOne.showBanner(banner, data.error || "Could not save memory", "err");
          return;
        }
        document.getElementById("memory-form").reset();
        AmberOne.showBanner(banner, "Memory saved.", "ok");
        loadMemories();
      };

      loadMemories();
    })();
  </script>
</body>
</html>
