<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billing · AmberOne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <nav class="nav" aria-label="Primary">
    <a class="nav-brand" href="/dashboard/">Amber<span>One</span></a>
    <button type="button" class="nav-toggle" data-nav-toggle aria-label="Menu">Menu</button>
    <div class="nav-links" data-nav-links>
      <a href="/dashboard/">Home</a>
      <a href="/dashboard/calendar">Calendar</a>
      <a href="/dashboard/reminders">Reminders</a>
      <a href="/dashboard/memories">Memories</a>
      <a href="/dashboard/notes">Notes</a>
      <a href="/dashboard/connections">Connections</a>
      <a href="/dashboard/billing">Billing</a>
      <a href="/dashboard/settings">Settings</a>
      <a class="nav-notif" href="/dashboard/notifications">Notifications<span class="badge" data-notif-badge hidden>0</span></a>
      <a href="#" data-logout>Log out</a>
    </div>
  </nav>
  <main class="wrap">
    <div class="dash-shell">
      <aside data-dash-nav></aside>
      <section>
        <h1>Billing</h1>
        <p class="lede">Manage subscription, open Stripe Customer Portal for upgrade / downgrade / cancel, and review recent events.</p>
        <div id="banner" class="banner"></div>
        <div class="stat-row" style="margin-bottom:1.25rem">
          <div class="stat"><span class="label">Plan</span><strong id="plan">—</strong></div>
          <div class="stat"><span class="label">Status</span><strong id="status">—</strong></div>
          <div class="stat"><span class="label">Stripe customer</span><strong id="customer">—</strong></div>
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.25rem">
          <button class="btn btn-primary" id="portal-btn" type="button">Customer portal</button>
          <a class="btn btn-ghost" href="/pricing">Change plan</a>
        </div>
        <div class="panel">
          <h2>Recent billing events</h2>
          <div id="events" class="lede">Loading…</div>
        </div>
      </section>
    </div>
  </main>
  <script src="/assets/app.js"></script>
  <script src="/assets/dash-chrome.js"></script>
  <script>
    (async () => {
      const user = await AmberOne.requireAuth();
      if (!user) return;
      const banner = document.getElementById("banner");
      if (AmberOne.qs("checkout") === "success") {
        AmberOne.showBanner(banner, "Checkout complete. Use Customer portal to upgrade, downgrade, or cancel.", "ok");
      }
      const { res, data } = await AmberOne.api("/api/billing");
      if (!res.ok) {
        AmberOne.showBanner(banner, data.error || "Failed to load billing", "err");
        return;
      }
      document.getElementById("plan").textContent = data.billing.planSlug || "None";
      document.getElementById("status").textContent = data.billing.status || "none";
      document.getElementById("customer").textContent = data.billing.note
        ? "Not available in beta"
        : data.billing.stripeCustomerId
          ? data.billing.stripeCustomerId.slice(0, 14) + "…"
          : "Not linked yet";
      if (data.billing.note) AmberOne.showBanner(banner, data.billing.note, "warn");
      const events = data.events || [];
      document.getElementById("events").innerHTML = events.length
        ? `<ul>${events.map((e) => `<li>${e.type} · ${e.created_at}</li>`).join("")}</ul>`
        : "No webhook events yet. Complete checkout and ensure STRIPE_WEBHOOK_SECRET is configured.";
      document.getElementById("portal-btn").onclick = async () => {
        const portal = await AmberOne.api("/api/portal", {
          method: "POST",
          body: JSON.stringify({ returnUrl: location.href }),
        });
        if (!portal.res.ok || !portal.data.url) {
          AmberOne.showBanner(banner, portal.data.error || "Portal unavailable", "err");
          return;
        }
        location.href = portal.data.url;
      };
    })();
  </script>
</body>
</html>
